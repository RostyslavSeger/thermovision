name: Build Android AAB
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node & Java
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Android Commandline Tools & Keystore
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -sL https://google.com -o cmdtools.zip
          unzip -q cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-34" > /dev/null
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s/android-sdk"}' "$JAVA_HOME" "$HOME" > "$HOME/.bubblewrap/config.json"
          keytool -genkeypair -v -keystore release.keystore -alias tvkey -keyalg RSA -keysize 2048 -validity 10000 -storepass Thermo2026 -keypass Thermo2026 -dname "CN=Rostyslav Zeger, OU=Dev, O=ThermoVision, L=Leutershausen, S=Bavaria, C=DE"
      - name: Build AAB
        run: |
          npm i -g @bubblewrap/cli
          mkdir twa && cd twa
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "io.github.rostyslavseger.thermovisionpro",
            "host": "rostyslavseger.github.io",
            "name": "ThermoVision PRO",
            "launcherName": "ThermoVision",
            "display": "standalone",
            "themeColor": "#05070e",
            "navigationColor": "#05070e",
            "backgroundColor": "#05070e",
            "enableNotifications": false,
            "startUrl": "/thermovision/",
            "iconUrl": "https://github.io",
            "maskableIconUrl": "https://github.io",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "../release.keystore",
              "alias": "tvkey"
            },
            "appVersionCode": 1,
            "appVersionName": "1.0.0",
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://github.io",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "orientation": "portrait"
          }
          EOF
          printf "Thermo2026\nThermo2026\n" | bubblewrap build --skipPwaValidation
      - name: Upload AAB and Keystore
        uses: actions/upload-artifact@v4
        with:
          name: ThermoVision-PlayStore-Bundle
          path: |
            twa/app-release-bundle.aab
            release.keystore
