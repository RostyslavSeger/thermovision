name: Build Android AAB
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Check Keystore & Build AAB
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/release.keystore" ]; then
            echo "ERROR: release.keystore NOT FOUND in repository root!"
            exit 1
          fi

          mkdir -p twa/src/main/res/drawable
          cd twa

          python3 -c '
          import zlib, struct, xml.dom.minidom as md

          w, h = 512, 512
          raw = b"".join(b"\x00" + b"\xff\x55\x00\xff" * w for _ in range(h))
          def chunk(t, d):
              return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
          open("src/main/res/drawable/ic_launcher.png", "wb").write(png)

          C = chr(58)
          A = lambda k: "android" + C + k

          doc = md.Document()
          m = doc.createElement("manifest")
          m.setAttribute("xmlns" + C + "android", "http://android.com")
          doc.appendChild(m)

          app = doc.createElement("application")
          app.setAttribute(A("allowBackup"), "true")
          app.setAttribute(A("icon"), "@drawable/ic_launcher")
          app.setAttribute(A("label"), "ThermoVision PRO")
          app.setAttribute(A("supportsRtl"), "true")
          app.setAttribute(A("theme"), "@android" + C + "style/Theme.Translucent.NoTitleBar")
          m.appendChild(app)

          md1 = doc.createElement("meta-data")
          md1.setAttribute(A("name"), "asset_statements")
          md1.setAttribute(A("value"), "[{\"relation\": [\"delegate_permission/common.handle_all_urls\"], \"target\": {\"namespace\": \"web\", \"site\": \"https://github.io\"}}]")
          app.appendChild(md1)

          act = doc.createElement("activity")
          act.setAttribute(A("name"), "com.google.androidbrowserhelper.trusted.LauncherActivity")
          act.setAttribute(A("exported"), "true")
          act.setAttribute(A("label"), "ThermoVision")
          app.appendChild(act)

          for k, v in [
              ("android.support.customtabs.trusted.DEFAULT_URL", "https://github.io/thermovision/"),
              ("android.support.customtabs.trusted.STATUS_BAR_COLOR", "#05070e"),
              ("android.support.customtabs.trusted.NAVIGATION_BAR_COLOR", "#05070e")
          ]:
              el = doc.createElement("meta-data")
              el.setAttribute(A("name"), k)
              el.setAttribute(A("value"), v)
              act.appendChild(el)

          if1 = doc.createElement("intent-filter")
          a1 = doc.createElement("action")
          a1.setAttribute(A("name"), "android.intent.action.MAIN")
          c1 = doc.createElement("category")
          c1.setAttribute(A("name"), "android.intent.category.LAUNCHER")
          if1.appendChild(a1)
          if1.appendChild(c1)
          act.appendChild(if1)

          if2 = doc.createElement("intent-filter")
          if2.setAttribute(A("autoVerify"), "true")
          a2 = doc.createElement("action")
          a2.setAttribute(A("name"), "android.intent.action.VIEW")
          c2 = doc.createElement("category")
          c2.setAttribute(A("name"), "android.intent.category.DEFAULT")
          c3 = doc.createElement("category")
          c3.setAttribute(A("name"), "android.intent.category.BROWSABLE")
          d1 = doc.createElement("data")
          d1.setAttribute(A("scheme"), "https")
          d1.setAttribute(A("host"), "rostyslavseger.github.io")
          d1.setAttribute(A("pathPrefix"), "/thermovision")
          for x in (a2, c2, c3, d1):
              if2.appendChild(x)
          act.appendChild(if2)

          open("src/main/AndroidManifest.xml", "wb").write(doc.toprettyxml(encoding="utf-8"))
          '

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=36
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = "twa"
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.5.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          apply plugin: 'com.android.application'
          android {
              namespace 'io.github.rostyslavseger.tvapp'
              compileSdk 36
              defaultConfig {
                  applicationId "io.github.rostyslavseger.tvapp"
                  minSdk 24
                  targetSdk 36
                  versionCode 2
                  versionName "1.0.1"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
          }
          EOF

          gradle wrapper --gradle-version 8.7
          ./gradlew bundleRelease --console=plain \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
            -Pandroid.injected.signing.store.password="Thermo2026" \
            -Pandroid.injected.signing.key.alias="tvkey" \
            -Pandroid.injected.signing.key.password="Thermo2026"

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: ThermoVision-PlayStore-Bundle-v2
          if-no-files-found: error
          path: twa/build/outputs/bundle/release/twa-release.aab
          
