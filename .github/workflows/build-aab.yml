name: Build Android AAB
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Check Keystore & Build AAB
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/release.keystore" ]; then
            echo "ERROR: release.keystore NOT FOUND in repository root!"
            exit 1
          fi

          git clone --depth 1 https://github.com helper
          cp -r helper/demos/twa-basic twa
          cd twa

          python3 -c '
          import zlib, struct
          w, h = 512, 512
          raw = b"".join(b"\x00" + b"\xff\x55\x00\xff" * w for _ in range(h))
          def chunk(t, d):
              return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
          for p in ["src/main/res/drawable/ic_launcher.png", "src/main/res/mipmap-xxxhdpi/ic_launcher.png"]:
              import os
              os.makedirs(os.path.dirname(p), exist_ok=True)
              open(p, "wb").write(png)
          '

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=36
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = "twa"
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.5.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          apply plugin: 'com.android.application'
          android {
              namespace 'io.github.rostyslavseger.tvapp'
              compileSdk 36
              defaultConfig {
                  applicationId "io.github.rostyslavseger.tvapp"
                  minSdk 24
                  targetSdk 36
                  versionCode 2
                  versionName "1.0.1"
                  manifestPlaceholders = [
                      hostName: "rostyslavseger.github.io",
                      defaultUrl: "https://github.io",
                      launcherName: "ThermoVision",
                      assetStatements: '[{"relation": ["delegate_permission/common.handle_all_urls"], "target": {"namespace": "web", "site": "https://github.io"}}]',
                      webManifestUrl: "https://github.iomanifest.json",
                      twaManifestUrl: "https://github.iomanifest.json",
                      statusBarColor: "#05070e",
                      navigationColor: "#05070e",
                      backgroundColor: "#05070e",
                      splashScreenFadeOutDuration: "300"
                  ]
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
          }
          EOF

          gradle wrapper --gradle-version 8.7
          ./gradlew bundleRelease --console=plain \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
            -Pandroid.injected.signing.store.password="Thermo2026" \
            -Pandroid.injected.signing.key.alias="tvkey" \
            -Pandroid.injected.signing.key.password="Thermo2026"

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: ThermoVision-PlayStore-Bundle-v2
          if-no-files-found: error
          path: twa/build/outputs/bundle/release/twa-release.aab
          
