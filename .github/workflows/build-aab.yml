name: Build Android AAB
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Check Keystore & Build AAB
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/release.keystore" ]; then
            echo "ERROR: release.keystore NOT FOUND in repository root!"
            exit 1
          fi
          mkdir -p twa/src/main/res/values twa/src/main/res/drawable
          python3 -c '
          from PIL import Image, ImageDraw
          import os
          src = "icon-512.png"
          dst = "twa/src/main/res/drawable/ic_launcher.png"
          if os.path.exists(src):
              im = Image.open(src).convert("RGBA").resize((512, 512))
          else:
              im = Image.new("RGBA", (512, 512), (255, 85, 0, 255))
              d = ImageDraw.Draw(im)
              d.ellipse((96, 96, 416, 416), fill=(255, 200, 0, 255))
          im.save(dst, "PNG")
          '
          cd twa

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = "twa"
          EOF

          cat << 'EOF' > src/main/res/values/strings.xml
          <resources>
              <string name="app_name">ThermoVision PRO</string>
              <string name="launcher_name">ThermoVision</string>
              <string name="asset_statements">[{"relation": ["delegate_permission/common.handle_all_urls"], "target": {"namespace": "web", "site": "https://github.io"}}]</string>
          </resources>
          EOF

          cat << 'EOF' > src/main/AndroidManifest.xml
          <manifest xmlns:android="http://android.com">
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Translucent.NoTitleBar">
                  <meta-data
                      android:name="asset_statements"
                      android:value="@string/asset_statements" />
                  <activity
                      android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                      android:exported="true"
                      android:label="@string/launcher_name">
                      <meta-data
                          android:name="android.support.customtabs.trusted.DEFAULT_URL"
                          android:value="https://github.io/thermovision/" />
                      <meta-data
                          android:name="android.support.customtabs.trusted.STATUS_BAR_COLOR"
                          android:resource="@android:color/black" />
                      <meta-data
                          android:name="android.support.customtabs.trusted.NAVIGATION_BAR_COLOR"
                          android:resource="@android:color/black" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data
                              android:scheme="https"
                              android:host="rostyslavseger.github.io"
                              android:pathPrefix="/thermovision" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.9.1'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          apply plugin: 'com.android.application'
          android {
              namespace 'io.github.rostyslavseger.tvapp'
              compileSdk 36
              defaultConfig {
                  applicationId "io.github.rostyslavseger.tvapp"
                  minSdk 24
                  targetSdk 36
                  versionCode 2
                  versionName "1.0.1"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2'
          }
          EOF

          gradle wrapper --gradle-version 8.11.1
          ./gradlew bundleRelease --console=plain \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
            -Pandroid.injected.signing.store.password="Thermo2026" \
            -Pandroid.injected.signing.key.alias="tvkey" \
            -Pandroid.injected.signing.key.password="Thermo2026"

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: ThermoVision-PlayStore-Bundle-v2
          if-no-files-found: error
          path: twa/build/outputs/bundle/release/twa-release.aab
