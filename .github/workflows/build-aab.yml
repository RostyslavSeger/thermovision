name: Build Android AAB
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Check Keystore & Build AAB
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/release.keystore" ]; then
            echo "ERROR: release.keystore NOT FOUND in repository root!"
            exit 1
          fi

          mkdir -p twa/src/main/res/drawable
          cd twa

          python3 -c '
          import zlib, struct
          w, h = 512, 512
          raw = b"".join(b"\x00" + b"\xff\x55\x00\xff" * w for _ in range(h))
          def chunk(t, d):
              return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
          open("src/main/res/drawable/ic_launcher.png", "wb").write(png)
          '

          echo "PG1hbmlmZXN0IHhtbG5zOmFuZHJvaWQ9Imh0dHA6Ly9zY2hlbWFzLmFuZHJvaWQuY29tL2Fw" > m.b64
          echo "ay9yZXMvYW5kcm9pZCI+PGFwcGxpY2F0aW9uIGFuZHJvaWQ6YWxsb3dCYWNrdXA9InRydWUi" >> m.b64
          echo "IGFuZHJvaWQ6aWNvbj0iQGRyYXdhYmxlL2ljX2xhdW5jaGVyIiBhbmRyb2lkOmxhYmVsPSJU" >> m.b64
          echo "aGVybW9WaXNpb24gUFJPIiBhbmRyb2lkOnN1cHBvcnRzUnRsPSJ0cnVlIiBhbmRyb2lkOnRo" >> m.b64
          echo "ZW1lPSJAYW5kcm9pZDpzdHlsZS9UaGVtZS5UcmFuc2x1Y2VudC5Ob1RpdGxlQmFyIj48bWV0" >> m.b64
          echo "YS1kYXRhIGFuZHJvaWQ6bmFtZT0iYXNzZXRfc3RhdGVtZW50cyIgYW5kcm9pZDp2YWx1ZT0i" >> m.b64
          echo "W3sncmVsYXRpb24nOiBbJ2RlbGVnYXRlX3Blcm1pc3Npb24vY29tbW9uLmhhbmRsZV9hbGxf" >> m.b64
          echo "dXJscyddLCAndGFyZ2V0JzogeyduYW1lc3BhY2UnOiAnd2ViJywgJ3NpdGUnOiAnaHR0cHM6" >> m.b64
          echo "Ly9yb3N0eXNsYXZzZWdlci5naXRodWIuaW8nfX1dIi8+PGFjdGl2aXR5IGFuZHJvaWQ6bmFt" >> m.b64
          echo "ZT0iY29tLmdvb2dsZS5hbmRyb2lkYnJvd3NlcmhlbHBlci50cnVzdGVkLkxhdW5jaGVyQWN0" >> m.b64
          echo "aXZpdHkiIGFuZHJvaWQ6ZXhwb3J0ZWQ9InRydWUiIGFuZHJvaWQ6bGFiZWw9IlRoZXJtb1Zp" >> m.b64
          echo "c2lvbiI+PG1ldGEtZGF0YSBhbmRyb2lkOm5hbWU9ImFuZHJvaWQuc3VwcG9ydC5jdXN0b210" >> m.b64
          echo "YWJzLnRydXN0ZWQuREVGQVVMVF9VUkwiIGFuZHJvaWQ6dmFsdWU9Imh0dHBzOi8vcm9zdHlz" >> m.b64
          echo "bGF2c2VnZXIuZ2l0aHViLmlvL3RoZXJtb3Zpc2lvbi8iLz48bWV0YS1kYXRhIGFuZHJvaWQ6" >> m.b64
          echo "bmFtZT0iYW5kcm9pZC5zdXBwb3J0LmN1c3RvbXRhYnMudHJ1c3RlZC5TVEFUVVNfQkFSX0NP" >> m.b64
          echo "TE9SIiBhbmRyb2lkOnZhbHVlPSIjMDUwNzBlIi8+PG1ldGEtZGF0YSBhbmRyb2lkOm5hbWU9" >> m.b64
          echo "ImFuZHJvaWQuc3VwcG9ydC5jdXN0b210YWJzLnRydXN0ZWQuTkFWSUdBVElPTl9CQVJfQ09M" >> m.b64
          echo "T1IiIGFuZHJvaWQ6dmFsdWU9IiMwNTA3MGUiLz48aW50ZW50LWZpbHRlcj48YWN0aW9uIGFu" >> m.b64
          echo "ZHJvaWQ6bmFtZT0iYW5kcm9pZC5pbnRlbnQuYWN0aW9uLk1BSU4iLz48Y2F0ZWdvcnkgYW5k" >> m.b64
          echo "cm9pZDpuYW1lPSJhbmRyb2lkLmludGVudC5jYXRlZ29yeS5MQVVOQ0hFUiIvPjwvaW50ZW50" >> m.b64
          echo "LWZpbHRlcj48aW50ZW50LWZpbHRlciBhbmRyb2lkOmF1dG9WZXJpZnk9InRydWUiPjxhY3Rp" >> m.b64
          echo "b24gYW5kcm9pZDpuYW1lPSJhbmRyb2lkLmludGVudC5hY3Rpb24uVklFVyIvPjxjYXRlZ29y" >> m.b64
          echo "eSBhbmRyb2lkOm5hbWU9ImFuZHJvaWQuaW50ZW50LmNhdGVnb3J5LkRFRkFVTFQiLz48Y2F0" >> m.b64
          echo "ZWdvcnkgYW5kcm9pZDpuYW1lPSJhbmRyb2lkLmludGVudC5jYXRlZ29yeS5CUk9XU0FCTEUi" >> m.b64
          echo "Lz48ZGF0YSBhbmRyb2lkOnNjaGVtZT0iaHR0cHMiIGFuZHJvaWQ6aG9zdD0icm9zdHlzbGF2" >> m.b64
          echo "c2VnZXIuZ2l0aHViLmlvIiBhbmRyb2lkOnBhdGhQcmVmaXg9Ii90aGVybW92aXNpb24iLz48" >> m.b64
          echo "L2ludGVudC1maWx0ZXI+PC9hY3Rpdml0eT48L2FwcGxpY2F0aW9uPjwvbWFuaWZlc3Q+" >> m.b64
          tr -d '\n' < m.b64 | base64 -d > src/main/AndroidManifest.xml

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=36
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = "twa"
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  maven { url "https://googleapis.com" }
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.5.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  maven { url "https://googleapis.com" }
                  mavenCentral()
              }
          }
          apply plugin: 'com.android.application'
          android {
              namespace 'io.github.rostyslavseger.tvapp'
              compileSdk 36
              defaultConfig {
                  applicationId "io.github.rostyslavseger.tvapp"
                  minSdk 24
                  targetSdk 36
                  versionCode 2
                  versionName "1.0.1"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
          }
          EOF

          gradle wrapper --gradle-version 8.7
          ./gradlew bundleRelease --max-workers=2 --console=plain \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
            -Pandroid.injected.signing.store.password="Thermo2026" \
            -Pandroid.injected.signing.key.alias="tvkey" \
            -Pandroid.injected.signing.key.password="Thermo2026"

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: ThermoVision-PlayStore-Bundle-v2
          if-no-files-found: error
          path: twa/build/outputs/bundle/release/twa-release.aab
          
