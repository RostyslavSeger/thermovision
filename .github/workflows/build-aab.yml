name: Build Android AAB
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Standalone TWA AAB
        run: |
          mkdir -p twa/src/main/res/values twa/src/main/res/drawable
          cd twa
          curl -sL "https://rostyslavseger.github.io/thermovision/icon-512.png" -o src/main/res/drawable/ic_launcher.png

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = "twa"
          EOF

          cat << 'EOF' > src/main/res/values/strings.xml
          <resources>
              <string name="app_name">ThermoVision PRO</string>
              <string name="launcher_name">ThermoVision</string>
              <string name="asset_statements">[{"relation": ["delegate_permission/common.handle_all_urls"], "target": {"namespace": "web", "site": "https://rostyslavseger.github.io"}}]</string>
          </resources>
          EOF

          cat << 'EOF' > src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Translucent.NoTitleBar">
                  <meta-data
                      android:name="asset_statements"
                      android:value="@string/asset_statements" />
                  <activity
                      android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                      android:exported="true"
                      android:label="@string/launcher_name">
                      <meta-data
                          android:name="android.support.customtabs.trusted.DEFAULT_URL"
                          android:value="https://rostyslavseger.github.io/thermovision/" />
                      <meta-data
                          android:name="android.support.customtabs.trusted.STATUS_BAR_COLOR"
                          android:resource="@android:color/black" />
                      <meta-data
                          android:name="android.support.customtabs.trusted.NAVIGATION_BAR_COLOR"
                          android:resource="@android:color/black" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data
                              android:scheme="https"
                              android:host="rostyslavseger.github.io"
                              android:pathPrefix="/thermovision" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.5.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          apply plugin: 'com.android.application'
          android {
              namespace 'io.github.rostyslavseger.tvpro'
              compileSdk 35
              defaultConfig {
                  applicationId "io.github.rostyslavseger.tvpro"
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName "1.0.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
          }
          EOF

          gradle wrapper --gradle-version 8.7
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/signing.keystore" \
            -Pandroid.injected.signing.store.password="XTz3NiqvaBFB" \
            -Pandroid.injected.signing.key.alias="my-key-alias" \
            -Pandroid.injected.signing.key.password="XTz3NiqvaBFB"

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: ThermoVision-PlayStore-Bundle
          if-no-files-found: error
          path: twa/build/outputs/bundle/release/twa-release.aab
