name: Build Android AAB
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias tvkey -keyalg RSA -keysize 2048 -validity 10000 -storepass Thermo2026 -keypass Thermo2026 -dname "CN=Rostyslav Zeger, OU=Dev, O=ThermoVision, L=Leutershausen, S=Bavaria, C=DE"
      - name: Clone Official Google TWA Template & Build AAB
        run: |
          git clone --depth 1 https://github.com helper
          cp -r helper/demos/twa-basic twa
          cd twa
          curl -sL https://github.io -o src/main/res/drawable/ic_launcher.png || true
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          apply plugin: 'com.android.application'
          android {
              namespace 'io.github.rostyslavseger.thermovisionpro'
              compileSdk 34
              defaultConfig {
                  applicationId "io.github.rostyslavseger.thermovisionpro"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
                  manifestPlaceholders = [
                      hostName: "rostyslavseger.github.io",
                      defaultUrl: "https://github.io",
                      launcherName: "ThermoVision",
                      assetStatements: '[{"relation": ["delegate_permission/common.handle_all_urls"], "target": {"namespace": "web", "site": "https://github.io"}}]',
                      webManifestUrl: "https://github.iomanifest.json",
                      twaManifestUrl: "https://github.iomanifest.json"
                  ]
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
          }
          EOF
          gradle wrapper --gradle-version 8.5
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
            -Pandroid.injected.signing.store.password="Thermo2026" \
            -Pandroid.injected.signing.key.alias="tvkey" \
            -Pandroid.injected.signing.key.password="Thermo2026"
      - name: Upload AAB and Keystore
        uses: actions/upload-artifact@v4
        with:
          name: ThermoVision-PlayStore-Bundle
          if-no-files-found: error
          path: |
            twa/build/outputs/bundle/release/twa-release.aab
            release.keystore
