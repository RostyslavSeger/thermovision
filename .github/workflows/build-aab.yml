name: Build Android AAB
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Check Keystore & Build AAB
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/release.keystore" ]; then
            echo "ERROR: release.keystore NOT FOUND in repository root!"
            exit 1
          fi
          mkdir -p twa/src/main/res/values twa/src/main/res/drawable
          python3 -c '
          import zlib, struct, xml.etree.ElementTree as ET

          w, h = 512, 512
          raw = b"".join(b"\x00" + b"\xff\x55\x00\xff" * w for _ in range(h))
          def chunk(t, d):
              return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
          open("twa/src/main/res/drawable/ic_launcher.png", "wb").write(png)

          ns = "http://android.com"
          ET.register_namespace("android", ns)
          A = lambda k: f"{{{ns}}}{k}"

          manifest = ET.Element("manifest")
          app = ET.SubElement(manifest, "application", {
              A("allowBackup"): "true",
              A("icon"): "@drawable/ic_launcher",
              A("label"): "ThermoVision PRO",
              A("supportsRtl"): "true",
              A("theme"): "@android:style/Theme.Translucent.NoTitleBar"
          })
          ET.SubElement(app, "meta-data", {
              A("name"): "asset_statements",
              A("value"): "[{\"relation\": [\"delegate_permission/common.handle_all_urls\"], \"target\": {\"namespace\": \"web\", \"site\": \"https://github.io\"}}]"
          })
          act = ET.SubElement(app, "activity", {
              A("name"): "com.google.androidbrowserhelper.trusted.LauncherActivity",
              A("exported"): "true",
              A("label"): "ThermoVision"
          })
          ET.SubElement(act, "meta-data", {
              A("name"): "android.support.customtabs.trusted.DEFAULT_URL",
              A("value"): "https://github.io/thermovision/"
          })
          ET.SubElement(act, "meta-data", {
              A("name"): "android.support.customtabs.trusted.STATUS_BAR_COLOR",
              A("value"): "#05070e"
          })
          ET.SubElement(act, "meta-data", {
              A("name"): "android.support.customtabs.trusted.NAVIGATION_BAR_COLOR",
              A("value"): "#05070e"
          })
          if1 = ET.SubElement(act, "intent-filter")
          ET.SubElement(if1, "action", {A("name"): "android.intent.action.MAIN"})
          ET.SubElement(if1, "category", {A("name"): "android.intent.category.LAUNCHER"})

          if2 = ET.SubElement(act, "intent-filter", {A("autoVerify"): "true"})
          ET.SubElement(if2, "action", {A("name"): "android.intent.action.VIEW"})
          ET.SubElement(if2, "category", {A("name"): "android.intent.category.DEFAULT"})
          ET.SubElement(if2, "category", {A("name"): "android.intent.category.BROWSABLE"})
          ET.SubElement(if2, "data", {
              A("scheme"): "https",
              A("host"): "rostyslavseger.github.io",
              A("pathPrefix"): "/thermovision"
          })

          ET.ElementTree(manifest).write("twa/src/main/AndroidManifest.xml", encoding="utf-8", xml_declaration=True)
          '
          cd twa

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=36
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = "twa"
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.5.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          apply plugin: 'com.android.application'
          android {
              namespace 'io.github.rostyslavseger.tvapp'
              compileSdk 36
              defaultConfig {
                  applicationId "io.github.rostyslavseger.tvapp"
                  minSdk 24
                  targetSdk 36
                  versionCode 2
                  versionName "1.0.1"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
          }
          EOF

          gradle wrapper --gradle-version 8.7
          ./gradlew bundleRelease --console=plain \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
            -Pandroid.injected.signing.store.password="Thermo2026" \
            -Pandroid.injected.signing.key.alias="tvkey" \
            -Pandroid.injected.signing.key.password="Thermo2026"

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: ThermoVision-PlayStore-Bundle-v2
          if-no-files-found: error
          path: twa/build/outputs/bundle/release/twa-release.aab
