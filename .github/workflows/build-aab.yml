name: Build Android AAB
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Tools & Keystore
        run: |
          sudo apt-get update && sudo apt-get install -y expect
          npm i -g @bubblewrap/cli
          yes | bubblewrap doctor || true
          "$HOME/.bubblewrap/jdk/"*/bin/keytool -genkeypair -v -keystore release.keystore -alias tvkey -keyalg RSA -keysize 2048 -validity 10000 -storepass Thermo2026 -keypass Thermo2026 -dname "CN=Rostyslav Zeger, OU=Dev, O=ThermoVision, L=Leutershausen, S=Bavaria, C=DE"
      - name: Init & Build AAB
        run: |
          mkdir twa && cd twa
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "io.github.rostyslavseger.thermovisionpro",
            "host": "rostyslavseger.github.io",
            "name": "ThermoVision PRO",
            "launcherName": "ThermoVision",
            "display": "standalone",
            "themeColor": "#05070e",
            "navigationColor": "#05070e",
            "backgroundColor": "#05070e",
            "enableNotifications": false,
            "startUrl": "/thermovision/",
            "iconUrl": "https://github.io",
            "maskableIconUrl": "https://github.io",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "../release.keystore",
              "alias": "tvkey"
            },
            "appVersionCode": 1,
            "appVersionName": "1.0.0",
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://github.io",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "orientation": "portrait"
          }
          EOF
          expect -c '
            set timeout 600
            spawn bubblewrap update --skipPwaValidation
            expect {
              "versionName" { send "1.0.0\r"; exp_continue }
              "regenerate" { send "Y\r"; exp_continue }
              eof
            }
          '
          expect -c '
            set timeout 600
            spawn bubblewrap build --skipPwaValidation
            expect {
              "regenerate" { send "Y\r"; exp_continue }
              "Key Store password" { send "Thermo2026\r"; exp_continue }
              "Key password" { send "Thermo2026\r"; exp_continue }
              eof
            }
          '
          find .. -name "*.aab"
      - name: Upload AAB and Keystore
        uses: actions/upload-artifact@v4
        with:
          name: ThermoVision-PlayStore-Bundle
          if-no-files-found: error
          path: |
            **/*.aab
            release.keystore
